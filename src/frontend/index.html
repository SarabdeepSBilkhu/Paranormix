<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paranormix | Diagnostic Terminal</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="brand">
                <span class="logo-text">PARANORMIX</span>
            </div>
            <div class="header-metadata mono" id="sessionHeader">
                <!-- Session Metadata injected here -->
            </div>
            <div class="header-controls">
                <button id="resetBtn" class="reset-link mono">AXIAL RESET</button>
            </div>
        </header>

        <main class="main-layout research-grid" id="mainGrid">
            <!-- Left Panel: Interactive Analyst Dialogue (Dynamic) -->
            <section class="research-panel catalyst-panel">
                <div class="panel-header flex-between">
                    <h2 class="mono">ANALYST DIALOGUE INTERFACE</h2>
                    <span class="status-indicator mono" id="analystStatus">READY</span>
                </div>
                
                <div id="chatContainer" class="terminal-output analyst-scroll">
                    <!-- Messages appear here -->
                </div>

                <div class="interrogation-input-group">
                    <div id="suggestedPrompts" class="prompt-suggestions mono">
                        <!-- Suggested follow-up prompts injected here -->
                    </div>
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Awaiting subject narrative for axial capture..." rows="1"></textarea>
                        <button id="sendBtn" class="primary-action">
                            <span class="mono">SUBMIT</span>
                        </button>
                    </div>
                </div>

                <footer class="terminal-footer research-footer">
                    <div class="footer-meta mono">
                        <span>MODEL: SGD LOGISTIC REGRESSION</span>
                        <span>LLM: ANALYST LLAMA3 DECODER</span>
                        <span id="sessionTimestamp">--</span>
                    </div>
                </footer>
            </section>

            <!-- Right Panel: Empirical Metrics (Static per Analysis) -->
            <section id="metricPanel" class="research-panel metric-panel panel-collapsed">
                <div class="panel-header">
                    <h2 class="mono">EMPIRICAL DATA AXIS</h2>
                </div>
                <div id="diagnosticDashboard" class="axial-scroll">
                    <!-- Injected via app.js -->
                </div>
            </section>
        </main>
    </div>

    <!-- Dashboard Template -->
    <template id="dashboardTemplate">
        <div class="axial-report">
            <!-- Section 1: Core Output -->
            <div class="axial-section core-report">
                <div class="metric-row">
                    <div class="metric-block">
                        <span class="label-mono">PRIMARY DIAGNOSIS</span>
                        <h1 id="dashPrediction" class="prediction-text">UNDETERMINED</h1>
                    </div>
                    <div class="metric-block align-right">
                        <span class="label-mono">CONFIDENCE BAND</span>
                        <div id="dashBand" class="band-indicator">--</div>
                    </div>
                </div>
                <div class="stability-text mono" id="dashStability">
                    Awaiting stability calculation...
                </div>
            </div>

            <!-- Section 2: Distribution -->
            <div class="axial-section">
                <h3 class="section-title mono">CLASS PROBABILITY DISTRIBUTION</h3>
                <div class="chart-box" id="chartClassScore"></div>
            </div>

            <!-- Section 3: Ranked Matches -->
            <div class="axial-section">
                <h3 class="section-title mono">COMPETING AXES / RESOLUTION</h3>
                <div id="rankedMatches" class="ranked-list mono">
                    <!-- Ranked items injected here -->
                </div>
            </div>

            <!-- Section 4: Grouped Signals -->
            <div class="axial-section">
                <h3 class="section-title mono">DETECTED SIGNALS</h3>
                <div class="signal-group">
                    <h4 class="mono small">OBSERVED PATTERNS</h4>
                    <ul id="observedSignals" class="signal-list"></ul>
                </div>
                <div class="signal-group">
                    <h4 class="mono small">ABSENT INDICATORS</h4>
                    <ul id="absentSignals" class="signal-list negative"></ul>
                </div>
            </div>
            
            <div class="session-audit mono">
                <span>WORD COUNT: <span id="dashWordCount">0</span></span>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
