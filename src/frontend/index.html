<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paranormix | Diagnostic Terminal</title>

    <link rel="stylesheet" href="style.css?v=7.1.0" />

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>

<body>
<div class="app-shell">

    <!-- HEADER -->
    <header class="main-header">
        <div class="brand">
            <span class="logo-text">PARANORMIX</span>
            <span class="logo-sub">Neural Classification Core</span>
        </div>

        <div class="header-metadata mono" id="sessionHeader">
            <!-- Injected -->
        </div>

        <div class="header-controls">
            <button id="resetBtn" class="reset-link">Reset Log</button>
        </div>
    </header>


    <!-- MAIN LAYOUT -->
    <main class="main-layout" id="mainGrid">

        <!-- LEFT PANEL -->
        <section class="research-panel">

            <div class="panel-header flex-between">
                <h2>Agent Voss</h2>
                <span class="status-indicator" id="analystStatus">Awaiting Input</span>
            </div>

            <div id="chatContainer" class="terminal-output analyst-scroll">
                <!-- Chat messages -->
            </div>

            <div class="interrogation-input-group">

                <div id="suggestedPrompts" class="prompt-suggestions"></div>

                <div class="input-wrapper">
                    <textarea id="userInput"
                              placeholder="Describe the occurrence for classification..."
                              rows="2"></textarea>

                    <button id="sendBtn" class="primary-action">
                        <span>Analyze</span>
                    </button>
                </div>
            </div>
        </section>


        <!-- RIGHT PANEL -->
        <section id="metricPanel" class="research-panel">

            <div class="panel-header">
                <h2>Diagnostic Dashboard</h2>
            </div>

            <div id="diagnosticDashboard" class="axial-scroll">
                <!-- Injected -->
            </div>

        </section>
    </main>
</div>


<!-- DASHBOARD TEMPLATE -->
<template id="dashboardTemplate">

    <div class="axial-report">

        <!-- RESULT -->
        <div class="axial-section">
            <div class="metric-row">

                <div class="metric-block">
                    <span class="label-mono">Classification Result</span>
                    <h1 id="dashPrediction" class="prediction-text">--</h1>
                </div>

                <div class="metric-block align-right">
                    <span class="label-mono">Confidence Level</span>
                    <div id="dashBand" class="band-indicator">--</div>
                </div>

            </div>

            <div id="dashConfidence" class="stability-text">
                --
            </div>
        </div>


        <!-- ML PROBABILITIES -->
        <div class="axial-section">
            <h3 class="section-title">ML Probability Distribution</h3>
            <div id="mlProbs" class="chart-box"></div>
        </div>


        <!-- EVIDENCE -->
        <div class="axial-section">
            <h3 class="section-title">Extracted Evidence Markers</h3>
            <div id="evidenceList" class="ranked-list"></div>
        </div>


        <!-- SIGNAL COMPETITION -->
        <div class="axial-section">
            <h3 class="section-title">Signal Competition Analysis</h3>

            <div class="signal-group">
                <h4 class="small">Lower-Scoring Signals</h4>
                <ul id="ignoredSignals" class="signal-list negative"></ul>
            </div>
        </div>

        <!-- MODEL PERF -->
        <div class="axial-section">
            <h3 class="section-title">Model Reliability Baseline (Test Metrics)</h3>
            <div id="modelMetricsGrid" class="metrics-grid"></div>
        </div>


        <!-- SESSION META -->
        <div class="session-audit mono">
            <span>
                ANALYSIS COMPLETE |
                WORD_COUNT: <span id="dashWordCount">0</span>
            </span>
        </div>

    </div>

</template>


<script src="app.js?v=6.2.0"></script>
</body>
</html>
