<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paranormix | Diagnostic Terminal</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app-shell">
        <header class="main-header">
            <div class="brand">
                <span class="logo-text">PARANORMIX</span>
                <span class="status-pill">V2.1_STABLE</span>
            </div>
            <div class="header-controls">
                <button id="resetBtn" class="reset-link">Terminate Investigation</button>
            </div>
        </header>

        <main class="main-layout">
            <!-- Left Panel: Diagnostic Dashboard (Populates on first run) -->
            <section id="diagnosticDashboard" class="dashboard-hidden">
                <!-- Injected via app.js -->
            </section>

            <!-- Right Panel: Conversation Terminal -->
            <section class="terminal-panel">
                <div id="chatContainer" class="terminal-output">
                    <!-- Messages appear here -->
                </div>

                <div class="terminal-input-group">
                    <div class="input-wrapper">
                        <textarea id="userInput" placeholder="Submit narrative for multi-axial analysis..." rows="1"></textarea>
                        <button id="sendBtn" class="primary-action">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <footer class="terminal-footer">
                    <div class="footer-meta">
                        <span class="meta-item">Powered by Groq-Llama3</span>
                        <span class="meta-item">Logic: Scikit-Learn Ensemble</span>
                    </div>
                </footer>
            </section>
        </main>
    </div>

    <!-- Dashboard Template -->
    <template id="dashboardTemplate">
        <div class="report-container">
            <div class="report-top">
                <div class="prediction-block">
                    <span class="label-mono">PRIMARY_DIAGNOSIS</span>
                    <h1 id="dashPrediction">NARRATIVE_UNDETERMINED</h1>
                </div>
                <div class="certainty-block">
                    <div id="dashCertainty" class="cert-pill">MEASURING_STABILITY...</div>
                </div>
            </div>

            <div class="report-body">
                <div class="report-card">
                    <h3 class="card-title">Class Distribution</h3>
                    <div class="chart-box" id="chartClassScore"></div>
                </div>

                <div class="report-card">
                    <h3 class="card-title">Categorical Drivers</h3>
                    <div class="check-box-group" id="chartDrivers"></div>
                </div>



                <div class="report-card full-span">
                    <h3 class="card-title">Global Validation Heatmap (ML Overlap)</h3>
                    <div class="heatmap" id="chartHeatmap"></div>
                </div>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
